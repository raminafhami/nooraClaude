map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name apksystems.ir www.apksystems.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name apksystems.ir www.apksystems.ir;

    ssl_certificate     /etc/nginx/certs/apksystems.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/apksystems.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend http://noora-frontend:3000;
    set $backend  http://noora-backend:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;

    location /backend/ {
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    location /socket.io/ {
        proxy_pass $backend;
    }

    location / {
        proxy_pass $frontend;
    }
}
